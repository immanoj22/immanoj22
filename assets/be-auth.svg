<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="Login with Spring Security architecture"><style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.e{animation:e 1.2s linear infinite}@keyframes e{to{stroke-dashoffset:-24}}.db,.nd{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{stroke-opacity:.25}}.sk{animation:sk 1.2s ease-in forwards}@keyframes sk{0%,60%{opacity:1}100%{opacity:0;visibility:hidden}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="420" height="250" rx="12" fill="#111a2e" stroke="#1f2a44"/><text x="18" y="30" font-size="16" font-weight="700" fill="#f8fafc">Login with Spring Security</text><text x="18" y="49" font-size="12" fill="#93c5fd">Sign up, sign in and JWT checks</text><path d="M98,138 L130,138" stroke="#2a3a5e" stroke-width="2" fill="none"/><path class="e" d="M98,138 L130,138" stroke="#5eead4" stroke-width="2" fill="none" stroke-dasharray="5 7" opacity=".7"/><circle r="3.5" fill="#5eead4"><animateMotion path="M98,138 L130,138" dur="1.60s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M220,138 L252,138" stroke="#2a3a5e" stroke-width="2" fill="none"/><path class="e" d="M220,138 L252,138" stroke="#5eead4" stroke-width="2" fill="none" stroke-dasharray="5 7" opacity=".7"/><circle r="3.5" fill="#5eead4"><animateMotion path="M220,138 L252,138" dur="1.75s" begin="0.3s" repeatCount="indefinite"/></circle><path d="M322,138 L338,138" stroke="#2a3a5e" stroke-width="2" fill="none"/><path class="e" d="M322,138 L338,138" stroke="#5eead4" stroke-width="2" fill="none" stroke-dasharray="5 7" opacity=".7"/><circle r="3.5" fill="#5eead4"><animateMotion path="M322,138 L338,138" dur="1.90s" begin="0.6s" repeatCount="in